<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: transparent; }
  .stage { position: relative; width: 100%; height: 100vh; min-height: 420px; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
</style>
</head>
<body>
  <div class="stage"><canvas id="c"></canvas></div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = canvas.clientWidth; H = canvas.clientHeight;
  canvas.width = W * DPR; canvas.height = H * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
window.addEventListener('resize', resize);

// BERRY colorway [R,G,B]: orange / berry red / dark purple
const COLORS = [ [232, 132, 90], [155, 34, 66], [61, 20, 54] ];

const blobs = [ { r:150, seed:0 }, { r:190, seed:2.1 }, { r:130, seed:4.3 } ];
let mx=0.5,my=0.5,tx=0.5,ty=0.5,idle=0;
window.addEventListener('pointermove', e=>{
  const rect=canvas.getBoundingClientRect();
  tx=(e.clientX-rect.left)/rect.width; ty=(e.clientY-rect.top)/rect.height; idle=0;
});
function draw(t){
  t*=0.001; idle+=0.016;
  if(idle>2.5){ tx+=(0.5-tx)*0.01; ty+=(0.5-ty)*0.01; }
  mx+=(tx-mx)*0.04; my+=(ty-my)*0.04;
  ctx.clearRect(0,0,W,H);
  ctx.globalCompositeOperation='lighter';
  blobs.forEach((b,i)=>{
    const wx=Math.sin(t*0.5+b.seed)*0.22+Math.cos(t*0.31+b.seed*1.7)*0.12;
    const wy=Math.cos(t*0.42+b.seed)*0.22+Math.sin(t*0.27+b.seed*1.3)*0.12;
    const pull=0.35;
    const cx=(0.5+wx*0.7)*(1-pull)+mx*pull, cy=(0.5+wy*0.7)*(1-pull)+my*pull;
    const px=cx*W, py=cy*H, rr=b.r*(1+0.18*Math.sin(t*1.1+b.seed));
    const [r,g,bl]=COLORS[i];
    const grad=ctx.createRadialGradient(px,py,0,px,py,rr);
    grad.addColorStop(0,`rgba(${r},${g},${bl},0.9)`);
    grad.addColorStop(0.4,`rgba(${r},${g},${bl},0.5)`);
    grad.addColorStop(1,`rgba(${r},${g},${bl},0)`);
    ctx.fillStyle=grad; ctx.beginPath(); ctx.arc(px,py,rr,0,Math.PI*2); ctx.fill();
  });
  requestAnimationFrame(draw);
}
resize(); requestAnimationFrame(draw);
</script>
</body>
</html>
